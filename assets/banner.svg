<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Daniel Henrick — Founder do Horizon Tool">
  <defs>
    <radialGradient id="sun" cx="600" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9714c" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#b75534" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#b75534" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0a07f"/>
      <stop offset="1" stop-color="#b75534" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#262a38" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .glow { animation: rise 5s ease-in-out infinite alternate; transform-origin: 600px 320px; }
    @keyframes rise { from { opacity: .75; transform: scale(.96); } to { opacity: 1; transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#08090d"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse class="glow" cx="600" cy="330" rx="520" ry="200" fill="url(#sun)"/>
    <rect x="0" y="268" width="1200" height="2" fill="url(#line)"/>
    <text x="600" y="128" text-anchor="middle" fill="#f5f7fa" font-size="60" font-weight="700" letter-spacing="-1.5">Daniel Henrick</text>
    <text x="600" y="172" text-anchor="middle" fill="#8b93a7" font-size="22">Founder do Horizon Tool  ·  Discord bots &amp; full-stack</text>
    <text x="600" y="232" text-anchor="middle" fill="#f0a07f" font-size="14" font-weight="600" letter-spacing="4">DH SOLUÇÕES</text>
  </g>
</svg>
