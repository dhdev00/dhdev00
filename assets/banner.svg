<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Daniel Henrick — Founder of Horizon Tool">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#b75534" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#b75534" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#b75534" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#d9714c"/>
      <stop offset="1" stop-color="#b75534" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262a38"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1200" height="280" fill="url(#fadeR)"/></mask>
    <clipPath id="card"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .logo { animation: float 6s ease-in-out infinite alternate; }
    @keyframes float { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#0b0c11"/>
    <rect width="1200" height="280" fill="url(#dots)" mask="url(#dotsMask)"/>
    <rect width="1200" height="280" fill="url(#glow)"/>
    <text x="72" y="96" fill="#d9714c" font-size="14" font-weight="700" letter-spacing="3.5">DH SOLUÇÕES</text>
    <text x="70" y="160" fill="#f5f7fa" font-size="58" font-weight="700" letter-spacing="-1.5">Daniel Henrick</text>
    <rect x="72" y="182" width="120" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="220" fill="#8b93a7" font-size="20">Founder of Horizon Tool · Discord bots &amp; full-stack</text>
    <g class="logo">
      <image x="880" y="62" width="234" height="156" opacity="0.95" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="19.5" fill="none" stroke="#262a38"/>
</svg>
